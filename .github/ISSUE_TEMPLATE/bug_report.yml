name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Ctrl+Shift+D
        2. Pick the arrow tool
        3. ...
  - type: input
    id: version
    attributes:
      label: Drawzy version
      description: Right-click the tray icon. The version is at the top of the menu.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help explain the problem.
