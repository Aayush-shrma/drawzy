name: Feature request
description: Suggest an idea for Drawzy
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Drawzy help?
      description: Your idea for how it could work, if you have one.
