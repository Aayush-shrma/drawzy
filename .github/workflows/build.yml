name: Build

# Every push and pull request builds Drawzy for Windows and macOS and launch-tests the packaged app.
# Pushing a tag like v1.2.0 also publishes the installers as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release once, up front, so both platforms upload into the same one.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Drawzy ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: always() && needs.release.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            app: dist/win-unpacked/Drawzy.exe
            files: |
              dist/Drawzy-Setup.exe
              dist/Drawzy-Setup.exe.blockmap
              dist/Drawzy-Portable.exe
              dist/latest.yml
          - os: macos-latest
            dist: dist:mac
            app: dist/mac-universal/Drawzy.app/Contents/MacOS/Drawzy
            files: |
              dist/Drawzy-mac.dmg
              dist/Drawzy-mac.dmg.blockmap
              dist/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run ${{ matrix.dist }}

      - name: Launch test
        shell: bash
        run: '"${{ matrix.app }}" --self-test'

      - uses: actions/upload-artifact@v4
        with:
          name: drawzy-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: ignore

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          shopt -s nullglob
          files=()
          for f in ${{ matrix.files }}; do [ -f "$f" ] && files+=("$f"); done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
