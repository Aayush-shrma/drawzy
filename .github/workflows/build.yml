name: Build

# Every push and pull request builds Drawzy for Windows, macOS and Linux and launch-tests the packaged app.
# Pushing a tag like v1.2.0 also publishes the installers as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release once, up front, so every platform uploads into the same one.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Drawzy ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: always() && needs.release.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            test: dist/win-unpacked/Drawzy.exe --self-test
            files: |
              dist/Drawzy-Setup.exe
              dist/Drawzy-Setup.exe.blockmap
              dist/Drawzy-Portable.exe
              dist/latest.yml
          - os: macos-latest
            dist: dist:mac
            test: dist/mac-universal/Drawzy.app/Contents/MacOS/Drawzy --self-test
            files: |
              dist/Drawzy-mac.dmg
              dist/Drawzy-mac.dmg.blockmap
              dist/latest-mac.yml
          # Installs the real .deb, then launches the installed app on a virtual display.
          - os: ubuntu-latest
            dist: dist:linux
            test: sudo apt-get install -y ./dist/Drawzy-linux.deb && xvfb-run -a /opt/Drawzy/drawzy --self-test
            files: |
              dist/Drawzy-linux.AppImage
              dist/Drawzy-linux.deb
              dist/Drawzy-linux.rpm
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb

      - run: npm ci

      - name: Build
        run: npm run ${{ matrix.dist }}

      - name: Launch test
        shell: bash
        run: ${{ matrix.test }}

      - uses: actions/upload-artifact@v5
        with:
          name: drawzy-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: ignore

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          files=()
          for f in $FILES; do [ -f "$f" ] && files+=("$f"); done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          FILES: ${{ matrix.files }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Installs the .rpm on a real Fedora and launches it, so Fedora users get a package that installs cleanly.
  fedora:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: drawzy-Linux

      - name: Install the .rpm
        run: dnf install -y ./Drawzy-linux.rpm xorg-x11-server-Xvfb

      # Containers run as root, which Chromium only allows without its sandbox.
      - name: Launch test
        run: xvfb-run -a /opt/Drawzy/drawzy --self-test --no-sandbox
